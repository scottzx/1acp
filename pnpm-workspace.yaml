packages:
  - packages/*

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  # Exact first-party releases verified by the coordinated release, not all recent dependencies.
  - "@1agents/dreammate-node@0.15.0"
  - "@1agents/dreammate-network@0.5.0"
  - "@openclaw/fs-safe@0.18.1"
  - "@openclaw/fs-safe-darwin-arm64@0.18.1"
  - "@openclaw/fs-safe-darwin-x64@0.18.1"
  - "@openclaw/fs-safe-linux-arm64-gnu@0.18.1"
  - "@openclaw/fs-safe-linux-arm64-musl@0.18.1"
  - "@openclaw/fs-safe-linux-x64-gnu@0.18.1"
  - "@openclaw/fs-safe-linux-x64-musl@0.18.1"
  - "@openclaw/fs-safe-win32-x64-msvc@0.18.1"

allowBuilds:
  # Published runtime is prebuilt; skip automatic installation of user-level skills.
  "@1agents/dreammate-node": false
  esbuild: false

overrides:
  brace-expansion: 5.0.12
  fast-uri: 4.1.5
  js-yaml: 5.4.1
  katex: 0.18.2
  markdown-it: 15.0.2
  qs: 6.16.0
  smol-toml: 1.9.0
  source-map-js: 1.2.2
