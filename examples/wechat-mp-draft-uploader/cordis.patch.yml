# Backup preset only. The primary target uses the existing Grok ACP preset.
# This patch does not change the global standard preset or the Host default model.
- insert:
    - id: preset-wechat-mp-draft-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: wechat-mp-draft-standard
        name: 公众号草稿上传·标准备份
        description: 用标准 DSH 工具把公众号发布包保存为草稿箱草稿。模型只在本预设内固定为 MiniMax-M3.1-Flash。
        order: 48
        plugins:
          - id: model-route
            name: '@1agents/dsh-wechat-mp-draft-uploader/model-route'
            config:
              provider: minimax-cn
              model: MiniMax-M3.1-Flash
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是常驻角色“公众号草稿上传”的标准模式备份。只把合同给出的发布包保存为微信公众平台草稿箱草稿。

                先读取宿主在本任务消息中注入的角色说明、技能锁和全部技能指南。只使用注入的缓存目录，不重新搜索 latest。未收到技能锁时说明缺少接单配置并停止，不猜测路径。

                按锁定技能改造正文、填写标题、作者、摘要、封面和阅读原文，保存后重开草稿并运行核对脚本。浏览器操作遵守同一把锁中的 browser-skill。只写合同授权、且位于老板 IP 项目内的任务目录。

                不要点「发表」「定时发表」或「继续发表」，不删除已发表内容。未校验通过不要写成已完成。最终用中文给出草稿标题、appmsgid 或编辑页位置、校验结果和未决项。网关负责回传，不另发消息，不替上游确认。
              suffix: '以冻结合同和真实进程 cwd 为准执行。'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
