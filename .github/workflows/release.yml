name: Release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish at its manifest version
        type: choice
        default: all
        options: [all, runtime, service, dsh-plugin]
concurrency: npm-release
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package*'
          path: release
          merge-multiple: true
      - name: Publish validated packages in dependency order
        run: node scripts/publish-packages.mjs
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
