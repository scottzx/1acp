name: ACP workspace
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/*.test.mjs
      - run: pnpm --filter @scottzx/1acp check
      - run: pnpm --filter @scottzx/1acp check:docs
      - run: pnpm --filter @1agents/acp-service typecheck
      - run: pnpm --filter @1agents/acp-service test
      - run: mkdir -p release && pnpm --filter @scottzx/1acp pack --pack-destination "$GITHUB_WORKSPACE/release" && pnpm --filter @1agents/acp-service pack --pack-destination "$GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-service-packages
          path: release/*.tgz
  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 21638c56315ae6a2b552d6091945d3144c9af32e
          path: .dsh-checkout
      - run: corepack pnpm install --frozen-lockfile
        working-directory: .dsh-checkout
      - run: corepack pnpm run build
        working-directory: .dsh-checkout
      - run: pnpm link:dsh "$GITHUB_WORKSPACE/.dsh-checkout"
      - run: pnpm --filter @1agents/acp-service... build
      - run: pnpm --filter @1agents/dsh-acp test
      - run: mkdir -p release && pnpm --filter @1agents/dsh-acp pack --pack-destination "$GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-package
          path: release/*.tgz
